name: CI

# PR-only. The gate on main is the required-status-check branch protection
# rule, not a push trigger — a merge only lands once this check has passed on
# the PR itself, so running it again on main would be pure duplication.
on:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Lint, types, format & tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # No version here: corepack picks up the packageManager pin in package.json.
            - name: Enable corepack
              run: corepack enable

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm types:check

            - name: Check formatting
              run: pnpm prettier:check

            - name: Test
              run: pnpm test:coverage

            - name: Build
              run: pnpm build
